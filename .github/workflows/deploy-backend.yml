name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "apps/zugov-backend/**"
      - "apps/coordinator/**"
      - "deploy/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/maci-backend
  COORDINATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/maci-coordinator

permissions:
  contents: read

jobs:
  # Images build here (GitHub-hosted runner) instead of on the production VPS. Building
  # both apps used to run inline in the SSH deploy script below, competing for CPU with
  # postgres/graph-node/coordinator/backend already live on that box — a routine deploy
  # of already-scoped, already-optimized Dockerfiles still blew through the 45m
  # command_timeout there (run 32254873537: coordinator's `pnpm run build` alone took
  # 12.4m). The deploy step now only pulls the images this job pushes.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/zugov-backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push coordinator
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/coordinator/Dockerfile
          push: true
          tags: |
            ${{ env.COORDINATOR_IMAGE }}:${{ github.sha }}
            ${{ env.COORDINATOR_IMAGE }}:latest
          cache-from: type=gha,scope=coordinator
          cache-to: type=gha,mode=max,scope=coordinator

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          # GITHUB_TOKEN here is the deploy job's own short-lived token (scoped to this run,
          # `packages: read` above) — forwarded into the remote script just to authenticate
          # the pull. No standing GHCR credential lives on the VPS or in its secrets.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR,IMAGE_TAG
          # Was 45m when this step built both images inline (see the `build` job comment
          # above for why that stopped working); dropped to 10m once it only pulled,
          # migrated, and restarted. Raised back to 20m after run 32277385065's deploy step
          # itself timed out — not a build problem this time: the VPS's disk (83% full,
          # shared/network-attached on this Contabo tier) hit a transient I/O stall mid-pull,
          # one layer extracting at ~1 byte/s for the whole remaining budget. `docker ps`/
          # `systemctl status docker` afterward showed a healthy daemon, no orphaned process
          # holding a lock — this was a one-off stall, not a stuck host, so the fix is
          # headroom to survive it, not a full build-timeout-sized budget.
          command_timeout: 20m
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            cd /opt/zugov
            git fetch origin main
            git reset --hard origin/main
            cd deploy
            export IMAGE_TAG
            docker compose pull backend coordinator
            docker compose run --rm backend node_modules/.bin/drizzle-kit migrate
            docker compose up -d
            # graph-node-config.toml is bind-mounted — compose only recreates a container when
            # the service definition itself changes, not when a mounted file's contents do, so
            # config edits (e.g. provider `features`) would otherwise never take effect on a
            # running graph-node otherwise. Its indexing state lives in the separate
            # graph-postgres volume, not the container, so recreating it is safe — but only do
            # it when the config actually changed, to avoid bouncing every community's subgraph
            # on every unrelated backend deploy.
            GRAPH_NODE_CONFIG_CHECKSUM_FILE="$HOME/.zugov-graph-node-config-checksum"
            NEW_CHECKSUM=$(sha256sum graph-node-config.toml | awk '{print $1}')
            OLD_CHECKSUM=$(cat "$GRAPH_NODE_CONFIG_CHECKSUM_FILE" 2>/dev/null || true)
            if [ "$NEW_CHECKSUM" != "$OLD_CHECKSUM" ]; then
              docker compose up -d --force-recreate graph-node
              echo "$NEW_CHECKSUM" >"$GRAPH_NODE_CONFIG_CHECKSUM_FILE"
            fi
            # -a (not just dangling): every deploy pulls a new :sha-tagged image, and each one
            # keeps its tag (isn't "dangling") even after superseded — plain `image prune -f`
            # would never reclaim them. `-a` is still safe: it only removes images with no
            # container referencing them, so the ones `up -d` just started are protected.
            #
            # timeout + `|| true`: run 32284681463 shows `up -d` completing (backend/coordinator
            # recreated and started) but the deploy step still timing out — 4+ minutes of total
            # silence right after, with `docker image prune -af` the only thing left in the
            # script. Enumerating every image on this VPS's disk is apparently expensive right
            # now (same symptom as `docker system df` hanging when checked directly), and
            # cleanup blocking on that turned an already-successful deploy into a reported
            # failure. Cleanup isn't time-critical; the deploy landing is — bound it so a slow
            # disk here can no longer take the whole step down with it.
            timeout 60s docker image prune -af || true
