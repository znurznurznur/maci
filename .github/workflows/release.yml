name: Release

on:
  push:
    tags: ["*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.2

      - name: Use Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf git://github.com/
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec lerna run build --scope @maci-protocol/sdk --include-dependencies

      - name: Pack
        run: |
          set -euo pipefail
          for pkg in crypto domainobjs core contracts sdk; do
            pnpm --filter "@maci-protocol/$pkg" pack --pack-destination "$RUNNER_TEMP/packages"
          done
          pnpm exec ts-node .github/scripts/packExtended.ts "$RUNNER_TEMP/packages" "$RUNNER_TEMP/tarballs"

      - name: Create release
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --prerelease \
            "$RUNNER_TEMP"/tarballs/*.tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
