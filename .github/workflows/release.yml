name: Release

on:
  push:
    # Excludes extended-maci-v* (published to GitHub Packages by publish-packages.yml
    # instead) -- this job publishes to the real npmjs.org registry via NPM_TOKEN, which
    # isn't configured in this fork and isn't the intended target for this fork's packages.
    tags: ["v*"]

jobs:
  draft-release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Draft Release
        run: |
          gh release create ${GITHUB_REF##*/} --title "${GITHUB_REF##*/}" --draft --generate-notes --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm run build

      - name: Publish NPM
        run: |
          # Prevent `git commit error`
          # It will not be pushed to GitHub as it is ephemeral
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"

          pnpm exec lerna publish from-package --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
